[package]
name = "screenlayout"
version = "0.1.0"
description = "Lightweight Windows window-tiling studio (egui + glow), AHK replacement"
license = "MIT"
authors = ["RTPC"]
rust-version = "1.85"
# Edition 2021 kept deliberately: edition 2024 makes unsafe_op_in_unsafe_fn deny-by-default, which breaks the Win32 extern "system" callbacks in engine.rs.
edition = "2021"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11"] }
egui = "0.37"
shadcn-egui = { version = "0.8", features = ["font-jetbrains-mono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
global-hotkey = "0.10"
tray-icon = "0.26"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_Graphics_Dwm",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Registry",
] }

[profile.release]
opt-level = 2
lto = true
strip = true
