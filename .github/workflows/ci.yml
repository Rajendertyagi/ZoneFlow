name: CI

on:
  push:
  pull_request:

# Least privilege: the workflow only reads the repo and uploads an artifact.
permissions:
  contents: read

# Supersede older runs on the same ref (saves runner minutes on rapid pushes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Format, lint, test and build
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # CI never pushes; don't persist the token in the local git config.
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      # setup-bun caches the Bun executable itself; cache the package download
      # cache separately so `bun install --frozen-lockfile` is fast on reruns.
      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      # --- Frontend: build the assets that rust-embed bakes into the exe ---
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Frontend check
        working-directory: frontend
        run: bun run check

      - name: Frontend tests
        working-directory: frontend
        run: bun test

      - name: Build frontend
        working-directory: frontend
        run: bun run build

      # rust-embed embeds the ROOT dist/ (see src/web/assets.rs), while Vite
      # emits frontend/dist/. Mirror the fresh build into dist/ and clear the
      # old contents first so stale hashed assets cannot linger in the exe.
      - name: Sync embedded assets (frontend/dist -> dist)
        shell: pwsh
        run: |
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse -Force frontend/dist/* dist/

      # --- Rust checks + release build (AFTER fresh dist/ is in place) ---
      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      # Advisory only: a fresh project (or a transitive dependency) may have
      # advisories on day one, so don't block the build on audit findings.
      # Remove `continue-on-error` once the dependency tree is audited clean.
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Security audit
        run: cargo audit
        continue-on-error: true

      - name: Release build
        run: cargo build --release

      - name: Upload release executable
        uses: actions/upload-artifact@v7
        with:
          name: screenlayout.exe
          path: target/release/screenlayout.exe
          if-no-files-found: error
          retention-days: 7
          # The exe is already compressed; skip recompression for a faster upload.
          compression-level: 0
